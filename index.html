    <!--
      Freshstart's own faces, used only inside that case study's brand spreads.

      Inter Tight is the licensed fallback for Neue Haas Unica, which needs a
      paid web licence and so is named in the stack but never loaded.
      Quicksand stands in for the "freshstart" wordmark until
      `freshstart-lockup.svg` arrives — the wordmark is artwork, not live
      text, so both this link and `.fs-wordmark-placeholder` go when it does.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Quicksand:wght@500&display=swap"
      rel="stylesheet"
    />
